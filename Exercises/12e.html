<!DOCTYPE html>
<html>
  <head>
    <title></title>
  </head>
  <body>
    <button class="js-button">Add to cart</button>
    <p class="result"></p>
    <script>
      let timeoutId;
      function AddToCart(){
        const button = document.querySelector('.result');
        button.innerHTML = 'Added';

      clearTimeout(timeoutId);
      
      timeoutId = setTimeout(() => {
        button.innerHTML= '';
      },2000);
      }

      document.querySelector('.js-button').addEventListener('click',() => {
        AddToCart();
      });

    </script>
  </body>
</html>
